name: probe contexts

# Keeps models.json's measured contexts current: probes every free model with
# one oversized (rejected, hence free) request per model and commits any drift
# back to main. Runs weekly, on demand, and after every release tag so the
# next release always ships fresh values.
#
# GitHub-hosted runners are not in the uni network, so the probes go through
# the built-in Fortinet tunnel (--vpn).
#
# One-time repo setup: Settings → Secrets → Actions →
#   UFR_PROBE_KEY      a normal UFR API key (dedicated/test account key is
#                      best — accepted probe rungs spend that account's
#                      $20/day budget, rejected ones are free)
#   UFR_VPN_LOGIN      uni login, e.g. xx0000@uni-freiburg.de
#   UFR_VPN_PASSWORD   the matching uni password

on:
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: probe-contexts
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.x"
      - name: probe all models (through the built-in VPN)
        run: bun scripts/probe-all-contexts.ts --key-env UFR_PROBE_KEY --vpn --write
        env:
          UFR_PROBE_KEY: ${{ secrets.UFR_PROBE_KEY }}
          UFR_VPN_LOGIN: ${{ secrets.UFR_VPN_LOGIN }}
          UFR_VPN_PASSWORD: ${{ secrets.UFR_VPN_PASSWORD }}
      - name: commit refreshed models.json
        run: |
          git config user.name "ufr-probe-bot"
          git config user.email "ufr-probe-bot@users.noreply.github.com"
          git add models.json
          if git diff --cached --quiet; then
            echo "models.json already current — nothing to commit"
          else
            git commit -m "chore: refresh measured model contexts (probe)"
            git push
          fi
