name: release

# Tag-driven release: push a tag `v*` (see scripts/release.sh) and the
# workflow verifies, publishes to npm (after manual approval) and creates
# the GitHub release with notes and the packed tarball.
#
# One-time repo setup (see README/CLAUDE.md):
#   - Settings → Environments → create "npm" with a required reviewer
#   - Settings → Secrets → Actions → NPM_TOKEN (npm automation token)

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify:
    # Same matrix as ci.yml — a release never goes out with a
    # platform-specific failure.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.x"
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun test

  publish:
    needs: verify
    runs-on: ubuntu-latest
    # The environment name is part of the OIDC claim npm's trusted-publisher
    # config expects — but this GitHub environment has no reviewer gate: the
    # only approval happens on npm's side (staged publish + 2FA).
    environment: npm
    permissions:
      id-token: write # OIDC trusted publishing — no NPM_TOKEN needed
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.x"

      - name: tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(bun -p "JSON.parse(await Bun.file('package.json').text()).version")"
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match package.json version $version" >&2
            echo "bump package.json first (scripts/release.sh does this)" >&2
            exit 1
          fi

      - run: bun install --frozen-lockfile

      # prepublishOnly runs typecheck + test again on the publish machine.
      # OIDC trusted publishing: npm ≥ 11.5.1 exchanges the Actions id-token
      # automatically — the package's trusted publisher config on npmjs.com
      # (repo + workflow filename + environment) must match this workflow.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      # staged publishing (npm ≥ 11.15): the version lands in the staging area;
      # a maintainer approves it with 2FA on npmjs.com (Staged Packages) or via
      # `npm stage approve` before it goes live.
      - name: stage package for review
        run: |
          npm install -g npm@latest
          npm stage publish

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.x"
      - run: bun install --frozen-lockfile

      # Pack exactly what was published and attach it, so the release page
      # shows the same bytes npm serves.
      - run: bun pm pack

      - name: create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes ./*.tgz
