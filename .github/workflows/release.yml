name: release

# Tag-driven release: push a tag `v*` (see scripts/release.sh) and the
# workflow verifies, publishes to npm (after manual approval) and creates
# the GitHub release with notes and the packed tarball.
#
# One-time repo setup (see README/CLAUDE.md):
#   - Settings → Environments → create "npm" with a required reviewer
#   - Settings → Secrets → Actions → NPM_TOKEN (npm automation token)

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify:
    # Same matrix as ci.yml — a release never goes out with a
    # platform-specific failure.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.x"
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun test

  publish:
    needs: verify
    runs-on: ubuntu-latest
    # The "npm" environment (with a required reviewer) gates this job:
    # publishing waits for manual approval in the Actions run.
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.x"

      - name: tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(bun -p "JSON.parse(await Bun.file('package.json').text()).version")"
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match package.json version $version" >&2
            echo "bump package.json first (scripts/release.sh does this)" >&2
            exit 1
          fi

      - run: bun install --frozen-lockfile

      # prepublishOnly runs typecheck + test again on the publish machine.
      - name: publish to npm
        run: bun publish --tag latest
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.x"
      - run: bun install --frozen-lockfile

      # Pack exactly what was published and attach it, so the release page
      # shows the same bytes npm serves.
      - run: bun pm pack

      - name: create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes ./*.tgz
